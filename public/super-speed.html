<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Speed · Punstem</title><link rel="stylesheet" href="/reference-theme.css"><link rel="stylesheet" href="/super-speed.css"><link rel="stylesheet" href="/hess-blocks.css"><script src="/site-settings.js?v=cookie-compat-1" defer></script><link rel="stylesheet" href="/compact-start.css"></head>
<body><main class="speed-shell">
 <header class="speed-header"><a class="brand" href="/">Punstem</a><nav class="nav"><a href="/math.html">Math</a><a href="/trainer.html">Chemistry</a><a href="/profile.html">Profile</a></nav></header>
 <section id="speedSetup" class="screen active"><h1>Super Speed</h1><p>Recognize. Tap. Next. No calculator.</p>
  <div class="subject-tabs" aria-label="Subject"><button data-subject="math" aria-pressed="true">Math</button><button data-subject="chemistry" aria-pressed="false">Chemistry</button></div>
  <button id="hessBlocksStart" class="hess-mode-launch" hidden>Hess’s Law blocks <span>Drag ×2, ×3, ×4, ×½ and F</span></button><details class="speed-topics-toggle"><summary>Choose topics</summary><div id="speedTopics" class="topic-grid"></div></details>
  <details class="speed-options-toggle"><summary>Time &amp; round options</summary><div class="speed-options"><label>Seconds per problem <output id="secondsValue">8s</output><input id="speedSeconds" type="range" min="3" max="30" value="8" aria-label="Seconds per Super Speed problem"></label><label>Problems<select id="speedCount"><option>10</option><option>20</option></select></label></div><p id="poolNotice" class="muted"></p><button id="resetRotation" class="secondary">Restart recognition pool</button></details><button id="speedStart" class="primary">Start</button><button id="speedSaved" class="speed-saved-link" hidden>Practice saved</button><p id="speedStartStatus" class="muted" role="status"></p>
 </section>
 <section id="quizScreen" class="screen"><div class="speed-top"><button id="speedExit" aria-label="End Super Speed round">×</button><progress id="speedProgress" max="10" value="0" aria-label="Round progress"></progress><span id="speedNumber">1 / 10</span></div>
  <article id="speedCard" class="question-card"><div class="speed-save-row"><button id="speedRedo" type="button" aria-label="Save this problem to redo later">Redo later</button></div><div id="speedClock" class="speed-clock" role="timer" aria-label="Time remaining"><strong id="time">8</strong></div><h2 id="speedQuestion"></h2><div id="speedData" class="speed-data"></div><div id="speedGraph"></div><p id="speedInstruction"></p><ol id="chosenSteps"></ol><div id="speedChoices" class="speed-choices"></div><div id="speedFeedback" role="status" aria-live="polite"></div><button id="speedContinue" class="primary" hidden>Continue</button><small id="speedSource" class="muted problem-source"></small></article>
 </section>
 <section id="speedResults" class="screen"><h1>Round finished</h1><div class="speed-metrics"><div><strong id="speedAccuracy"></strong><span>Accuracy</span></div><div><strong id="speedAverage"></strong><span>Average recognition time</span></div></div><p id="speedSaveStatus" class="muted" role="status"></p><button id="speedAgain" class="primary">Play again</button><button id="speedSettings" class="secondary">Change topics</button><details><summary>Show round review</summary><div id="speedReview"></div></details></section>
</main><script src="/source-questions.js"></script><script src="/chem-unit3.js"></script><script src="/chem-unit4.js?v=unit4-1"></script><script src="/super-speed-bank.js"></script><script src="/hess-blocks.js"></script><script src="/notebook.js"></script><script src="/learning.js?v=unit4-2"></script><script src="/gemini-help.js?v=tutor-scope-2"></script><script src="/quit-confirm.js"></script><script src="/problem-mascot.js?v=tutor-scope-2"></script><script src="/super-speed.js?v=unit4-2"></script></body></html>
