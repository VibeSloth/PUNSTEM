<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Punstem — Profile</title>
<style>
:root{--ink:#17243a;--muted:#68758a;--line:#e1e7ef;--blue:#246bfd;--red:#bd3345}*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:var(--ink);font:16px/1.5 Arial,Helvetica,sans-serif}.shell{width:min(920px,calc(100% - 28px));margin:auto;padding:18px 0 56px}.top{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:#fff;border:1px solid var(--line);border-radius:16px}.brand{font-weight:900}.nav{display:flex;gap:6px;flex-wrap:wrap}.nav a{padding:8px 10px;border-radius:9px;color:#354761;text-decoration:none;font-weight:700;font-size:.85rem}.nav a.active{background:#eef4ff;color:#174ea6}h1{font-size:clamp(2.2rem,6vw,4rem);letter-spacing:-.05em;margin:50px 0 22px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:22px;margin:14px 0}.card h2{margin:0 0 7px;font-size:1.3rem}.card p{color:var(--muted);margin:0 0 16px}.row{display:flex;gap:8px}.row input,.problem-form textarea{flex:1;min-width:0;border:1px solid #cbd5e1;border-radius:10px;padding:11px;font:inherit}.row button,.primary{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.status{font-size:.85rem;color:var(--muted);margin-top:9px}.diagnostic-q{padding:13px 0;border-top:1px solid var(--line)}.diagnostic-q label{display:block;font-weight:800;margin-bottom:7px}.diagnostic-q input{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px}.problem-form{display:grid;gap:9px}.problem-form textarea{min-height:84px;resize:vertical}.problem-list{margin-top:18px}.problem{display:grid;grid-template-columns:1fr auto;gap:10px;border-top:1px solid var(--line);padding:13px 0}.problem small{color:var(--muted);display:block}.delete{border:0;background:none;color:var(--red);font-weight:800;cursor:pointer}.practice-box{display:none;margin-top:16px;padding:18px;border-radius:13px;background:#f4f7fb}.practice-box.show{display:block}.practice-box h3{white-space:pre-wrap}.practice-box input{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px;margin-bottom:8px}@media(max-width:680px){.top{align-items:flex-start}.nav{justify-content:flex-end}.row{flex-direction:column}}
</style><link rel="stylesheet" href="/reference-theme.css"><script src="/site-settings.js?v=cookie-compat-1" defer></script><link rel="stylesheet" href="/compact-start.css"></head><body><main class="shell">
<header class="top"><div class="brand">Punstem</div><nav class="nav"><a href="/">Home</a><a href="/math.html">Math</a><a href="/trainer.html">Chemistry</a><a class="active" href="/profile.html">Profile</a></nav><a href="/study.html">Study hub & spaced review →</a></header>
<h1>Your profile</h1><div id="accountStatus">Loading…</div><section id="accountMetrics"></section><link rel="stylesheet" href="/account-progress.css"><script src="/account-progress.js" defer></script><script src="/notebook.js" defer></script><script src="/learning.js" defer></script>
<section class="card"><h2>Name</h2><p>Your display name</p><div class="row"><input id="name" maxlength="24" autocomplete="nickname"><button id="saveName">Save name</button></div><div class="status" id="nameStatus"></div></section>
<section class="card" id="diagnostic"><h2>Quick diagnostic</h2><p>Six short questions. Your result suggests a math level and chemistry timer.</p><div id="diagnosticQuestions"></div><button class="primary" id="gradeDiagnostic">Get recommendation</button><div class="status" id="diagnosticResult"></div></section>
<section class="card" id="my-problems"><h2>My Problems</h2><p>Save questions you missed, add the correct answer, and retry them later.</p><div class="problem-form"><textarea id="problemText" placeholder="Paste or type the problem"></textarea><div class="row"><input id="problemAnswer" placeholder="Correct answer"><button id="addProblem">Save problem</button></div></div><div class="problem-list" id="problemList"></div><button class="primary" id="practiceProblems">Practice saved problems</button><div class="practice-box" id="practiceBox"><div class="status" id="practiceCount"></div><h3 id="practiceQuestion"></h3><input id="practiceAnswer" placeholder="Your answer"><div class="row"><button class="primary" id="checkProblem">Check</button><button class="primary" id="nextProblem">Next</button></div><div class="status" id="practiceFeedback"></div></div></section>
</main><script>
const $=s=>document.querySelector(s);function deviceId(){let id=localStorage.getItem('functionSprintDevice');if(!id){id=crypto.randomUUID().replaceAll('-','');localStorage.setItem('functionSprintDevice',id)}return id}function clean(s){return String(s).trim().toLowerCase().replace(/[−–—]/g,'-').replace(/\s+/g,'')}function num(s){const t=clean(s).replace(/,/g,'');const f=t.match(/^([-+]?\d*\.?\d+)\/([-+]?\d*\.?\d+)/);if(f)return Number(f[1])/Number(f[2]);const m=t.match(/[-+]?\d*\.?\d+(?:e[-+]?\d+)?/);return m?Number(m[0]):NaN}function same(a,b){const x=num(a),y=num(b);if(Number.isFinite(x)&&Number.isFinite(y))return Math.abs(x-y)<=Math.max(.05,Math.abs(y)*.02);return clean(a)===clean(b)}
$('#name').value=localStorage.getItem('functionSprintPlayerName')||'Player '+deviceId().slice(0,4);$('#saveName').onclick=async()=>{const name=$('#name').value.trim().replace(/\s+/g,' ');if(!/^[\p{L}\p{N}][\p{L}\p{N} ._'-]{0,23}$/u.test(name))return $('#nameStatus').textContent='Use 1–24 letters or numbers.';localStorage.setItem('functionSprintPlayerName',name);$('#nameStatus').textContent='Saving…';try{await fetch('/api/progress',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({profileOnly:true,deviceId:deviceId(),playerName:name})});$('#nameStatus').textContent='Profile saved.'}catch{$('#nameStatus').textContent='Remembered on this device.'}};
const dq=[['Evaluate f(−2) if f(x)=3x²−4.','8'],['If f(2)=5 and g(5)=−1, find (g∘f)(2).','-1'],['Classify f(x)=x³−4x as even, odd, or neither.','odd'],['Find q for 100 g of water warmed 5°C. Use c=4.18 J/(g·°C).','2090'],['What happens to ΔH when a reaction is reversed?','sign changes'],['At equilibrium, what is ΔG?','0']];$('#diagnosticQuestions').innerHTML=dq.map((q,i)=>'<div class="diagnostic-q"><label for="dq'+i+'">'+(i+1)+'. '+q[0]+'</label><input id="dq'+i+'" placeholder="Short answer"></div>').join('');$('#gradeDiagnostic').onclick=()=>{const checks=dq.map((q,i)=>same($('#dq'+i).value,q[1])||(i===4&&/reverse|opposite|change/.test(clean($('#dq'+i).value)))),score=checks.filter(Boolean).length,math=checks.slice(0,3).filter(Boolean).length,chem=checks.slice(3).filter(Boolean).length,recommend={difficulty:math>=3?'hard':'standard',seconds:chem>=3?35:chem===2?50:65,adaptive:true,score};localStorage.setItem('punstemDiagnostic',JSON.stringify(recommend));$('#diagnosticResult').textContent=score+'/6 correct. Math: '+recommend.difficulty+'. Chemistry: start at '+recommend.seconds+'s with adaptive timing. These settings will load automatically.'};
function problems(){try{return JSON.parse(localStorage.getItem('punstemMyProblems')||'[]')}catch{return[]}}function saveProblems(x){localStorage.setItem('punstemMyProblems',JSON.stringify(x));renderProblems()}function safe(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function renderProblems(){const list=problems();$('#problemList').innerHTML=list.length?list.map((p,i)=>'<div class="problem"><div><strong>'+safe(p.q)+'</strong><small>Answer: '+safe(p.a)+'</small></div><button class="delete" data-delete="'+i+'">Remove</button></div>').join(''):'<div class="status">No saved problems yet.</div>';document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const x=problems();x.splice(+b.dataset.delete,1);saveProblems(x)})}$('#addProblem').onclick=()=>{const q=$('#problemText').value.trim(),a=$('#problemAnswer').value.trim();if(!q||!a)return;const x=problems();x.push({q:q.slice(0,500),a:a.slice(0,120)});saveProblems(x);$('#problemText').value='';$('#problemAnswer').value=''};let deck=[],di=0;function showProblem(){const p=deck[di];$('#practiceCount').textContent='Problem '+(di+1)+' of '+deck.length;$('#practiceQuestion').textContent=p.q;$('#practiceAnswer').value='';$('#practiceFeedback').textContent=''}$('#practiceProblems').onclick=()=>{deck=[...problems()].sort(()=>Math.random()-.5);if(!deck.length)return;di=0;$('#practiceBox').classList.add('show');showProblem()};$('#checkProblem').onclick=()=>{$('#practiceFeedback').textContent=same($('#practiceAnswer').value,deck[di].a)?'Correct.':'Not yet. Answer: '+deck[di].a};$('#nextProblem').onclick=()=>{di=(di+1)%deck.length;showProblem()};renderProblems();
</script></body></html>
